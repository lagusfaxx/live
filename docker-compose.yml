services:
  livekit:
    build:
      context: ./livekit
      dockerfile: Dockerfile
    command: --config /etc/livekit/livekit.yaml --node-ip=${PUBLIC_IPV4}
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "50000-50100:50000-50100/udp"

  live-token-api:
    build:
      context: ./token-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      SHARED_BEARER_TOKEN: ${SHARED_BEARER_TOKEN}
      DEFAULT_CAN_PUBLISH: ${DEFAULT_CAN_PUBLISH:-false}
    ports:
      - "3001:3000/tcp"
