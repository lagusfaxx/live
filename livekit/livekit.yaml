port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
  # Enable ICE-lite for better NAT traversal as SFU
  use_ice_lite: true

turn:
  enabled: true
  domain: turn.uzeed.cl
  tls_port: 5349
  udp_port: 3478
  # Use external coturn TURN server credentials
  external_tls: true

redis: {}

# Las llaves reales se inyectan por variable de entorno LIVEKIT_KEYS
keys:
  devkey: secret

logging:
  level: info
